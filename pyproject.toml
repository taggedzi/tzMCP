[build-system]
requires = ["setuptools>=77.0.0",]
build-backend = "setuptools.build_meta"

[project]
name = "tzMCP"
version = "0.0.1"
description = "A Media Download Proxy. Using mitmproxy to allow download of media from browsed sites, including html, css, js, images, and other media types."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = [ "Media Download Proxy", "Mitmproxy", "HTML", "CSS", "JavaScript", "Images", "Other Media Types", "Download Proxy",]
classifiers = [ "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Operating System :: OS Independent", "Development Status :: 3 - Alpha", "Environment :: Console", "Environment :: X11 Applications :: tkinter", "Topic :: Utilities",]
dependencies = [
    # Security floors for transitive proxy dependencies also apply to wheel installs.
    "Brotli==1.2.1",
    "certifi>=2026.10.23",
    "cryptography>=50.0.2",
    "filetype==1.2.0",
    "h2>=4.4.1",
    "mitmproxy==12.3.0",
    "Pillow==13.0.0",
    "psutil==7.0.0",
    "pyOpenSSL>=26.4.0",
    "PyYAML==6.0.2",
    "requests==2.33.0",
    "tornado>=6.5.10",
    "watchdog==6.0.0",
]
[[project.authors]]
name = "Matthew Craig"
email = "taggedzi.mpc@gmail.com"

[project.optional-dependencies]
dev = [ "coverage==7.8.0", "invoke==2.2.0", "pdoc==15.0.3", "pytest==9.0.3", "pytest-cov==6.1.1", "toml==0.10.2",]

[project.scripts]
tzMCP-cli = "tzMCP.cli:main"
tzMCP-gui = "tzMCP.gui:main"

[project.urls]
Homepage = "https://github.com/taggedzi/tzMCP"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
