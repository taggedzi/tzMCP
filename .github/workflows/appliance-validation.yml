name: Appliance source validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    name: Check appliance shell scripts
    runs-on: ubuntu-24.04
    steps:
      # Repository policy allows only owner-hosted, SHA-pinned actions.
      # Bootstrap with runner tools rather than external actions.
      - name: Check out the workflow revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git checkout --detach FETCH_HEAD
      - name: Check shell sources
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck appliance/provisioning/*.sh \
            appliance/files/tzmcp-display-mode
      - name: Check Python export helper
        run: |
          python3 -I -c 'from pathlib import Path; p = Path("appliance/files/tzmcp-export-helper"); compile(p.read_bytes(), str(p), "exec")'
          sudo python3 -I -m unittest discover -s tests/unit -p test_export_helper.py -v

  packer:
    name: Build wheel and validate Packer configuration
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the workflow revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git checkout --detach FETCH_HEAD
      - name: Select Python 3.12
        run: |
          python_dir="$(find "$RUNNER_TOOL_CACHE/Python" -mindepth 2 -maxdepth 2 -type d -path '*/3.12.*/x64' | sort -V | tail -n 1)"
          test -n "$python_dir"
          echo "$python_dir/bin" >> "$GITHUB_PATH"
      - name: Build a validation wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
      - name: Install Packer
        env:
          PACKER_VERSION: "1.14.0"
          # Official packer_1.14.0_SHA256SUMS, linux_amd64 archive.
          PACKER_SHA256: ce313ccd3f7f9606cb2eb02db49607960fbaa1ed76bf24b7c4a0850ce743d66a
        run: |
          archive="$RUNNER_TEMP/packer_${PACKER_VERSION}_linux_amd64.zip"
          curl --fail --silent --show-error --location --retry 3 \
            "https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_linux_amd64.zip" \
            --output "$archive"
          printf '%s  %s\n' "$PACKER_SHA256" "$archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/packer"
          echo "$RUNNER_TEMP/packer" >> "$GITHUB_PATH"
      - name: Validate Packer configuration
        working-directory: appliance/packer
        env:
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          packer fmt -check .
          packer init .
          wheels=("$GITHUB_WORKSPACE"/dist/*.whl)
          test "${#wheels[@]}" -eq 1
          test -f "${wheels[0]}"
          packer validate \
            -var 'build_password=validation-only' \
            -var 'build_password_hash=validation-only' \
            -var "tzmcp_wheel=${wheels[0]}" \
            .
